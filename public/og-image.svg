<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <radialGradient id="sapphireGlow" cx="25%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="85%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <!-- Logo Gradients -->
    <linearGradient id="logoTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <linearGradient id="logoLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="logoRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.65" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glows -->
  <circle cx="300" cy="200" r="450" fill="url(#sapphireGlow)" />
  <circle cx="950" cy="450" r="380" fill="url(#emeraldGlow)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.07" stroke="#60A5FA" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Kenya Flag Mini Ribbon Top Border -->
  <rect x="0" y="0" width="1200" height="4" fill="#000000" />
  <rect x="0" y="4" width="1200" height="2" fill="#FFFFFF" />
  <rect x="0" y="6" width="1200" height="4" fill="#BB0000" />
  <rect x="0" y="10" width="1200" height="2" fill="#FFFFFF" />
  <rect x="0" y="12" width="1200" height="4" fill="#006600" />

  <!-- Left Content Area -->
  <g transform="translate(90, 80)">
    <!-- Location Badge -->
    <g transform="translate(0, 0)">
      <rect width="250" height="38" rx="19" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" />
      <!-- Kenya Flag Dot -->
      <circle cx="20" cy="19" r="8" fill="#BB0000" stroke="#FFFFFF" stroke-width="1.5" />
      <text x="36" y="24" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">KENYA'S OFFICIAL ADVISOR</text>
    </g>

    <!-- Logo & Brand Row -->
    <g transform="translate(0, 60)">
      <!-- 3D Logo SVG (Scaled) -->
      <g transform="translate(0, 0) scale(1.1)">
        <!-- Pedestal / Base -->
        <polygon points="48,72 16,56 48,42 80,56" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
        <polygon points="16,56 48,72 48,78 16,62" fill="#0B0F19" />
        <polygon points="80,56 48,72 48,78 80,62" fill="#111827" />
        <!-- Cap Diamond Top -->
        <polygon points="48,16 84,36 48,54 12,36" fill="url(#logoTop)" stroke="#93C5FD" stroke-width="1.5" />
        <polygon points="48,20 78,36 48,50 18,36" fill="#1D4ED8" fill-opacity="0.5" />
        <!-- Tassel -->
        <path d="M 48 35 Q 36 32 30 40 T 26 56" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
        <circle cx="26" cy="57" r="3.5" fill="#FBBF24" />
        <!-- AI Star Beacon -->
        <polygon points="78,22 81,15 88,18 83,24 87,31 80,28 75,34 76,26" fill="#10B981" />
        <circle cx="80" cy="22" r="2.5" fill="#ECFDF5" />
      </g>

      <!-- Brand Name -->
      <text x="110" y="55" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">EduPath<tspan fill="#38BDF8"> AI</tspan></text>
      <text x="110" y="82" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="2">SMART KCSE COURSE MATCHER &amp; KUCCPS ADVISOR</text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="215" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" line-height="1.2">
      Turn KCSE Grades Into
    </text>
    <text x="0" y="265" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800">
      Qualified Degree Programmes
    </text>

    <!-- Subtitle -->
    <text x="0" y="315" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      Explore 2,084+ courses across 69 Kenyan public &amp; chartered private universities.
    </text>

    <!-- Metric Badges Row -->
    <g transform="translate(0, 360)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="180" height="60" rx="14" fill="url(#cardBg)" stroke="#3B82F6" stroke-width="1.5" />
      <text x="20" y="26" fill="#60A5FA" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">KUCCPS FORMULA</text>
      <text x="20" y="48" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">20 Clusters</text>

      <!-- Badge 2 -->
      <rect x="195" y="0" width="180" height="60" rx="14" fill="url(#cardBg)" stroke="#10B981" stroke-width="1.5" />
      <text x="215" y="26" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">KENYAN UNIVERSITIES</text>
      <text x="215" y="48" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">69 Institutions</text>

      <!-- Badge 3 -->
      <rect x="390" y="0" width="180" height="60" rx="14" fill="url(#cardBg)" stroke="#F59E0B" stroke-width="1.5" />
      <text x="410" y="26" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">ACCURACY</text>
      <text x="410" y="48" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">100% Validated</text>
    </g>

    <!-- Footer URL -->
    <g transform="translate(0, 455)">
      <circle cx="8" cy="12" r="5" fill="#10B981" />
      <text x="22" y="16" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">
        Nairobi, Kenya • <tspan fill="#38BDF8">https://edupath.co.ke</tspan>
      </text>
    </g>
  </g>

  <!-- Right Floating Glass Card: University Match Showcase -->
  <g transform="translate(730, 95)">
    <!-- Main Floating Card -->
    <rect width="380" height="430" rx="24" fill="#0F172A" fill-opacity="0.85" stroke="#334155" stroke-width="2" />

    <!-- Card Header -->
    <g transform="translate(24, 28)">
      <text x="0" y="18" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">LIVE CANDIDATE MATCH</text>
      <text x="0" y="42" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">KCSE Aggregate: A- (76 pts)</text>
    </g>

    <!-- University Item 1 -->
    <g transform="translate(24, 95)">
      <rect width="332" height="72" rx="14" fill="#1E293B" stroke="#2563EB" stroke-width="1.5" />
      <text x="18" y="28" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">University of Nairobi (UoN)</text>
      <text x="18" y="48" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">B.Sc. Computer Science • Cut-off: 42.1</text>
      <rect x="240" y="14" width="76" height="26" rx="13" fill="#10B981" fill-opacity="0.2" />
      <text x="254" y="32" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">QUALIFIED</text>
    </g>

    <!-- University Item 2 -->
    <g transform="translate(24, 180)">
      <rect width="332" height="72" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="18" y="28" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">JKUAT Main Campus</text>
      <text x="18" y="48" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">B.Sc. Mechanical Engineering</text>
      <rect x="240" y="14" width="76" height="26" rx="13" fill="#10B981" fill-opacity="0.2" />
      <text x="254" y="32" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">QUALIFIED</text>
    </g>

    <!-- University Item 3 -->
    <g transform="translate(24, 265)">
      <rect width="332" height="72" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="18" y="28" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Strathmore University</text>
      <text x="18" y="48" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">B.Sc. Informatics &amp; Analytics</text>
      <rect x="240" y="14" width="76" height="26" rx="13" fill="#3B82F6" fill-opacity="0.2" />
      <text x="252" y="32" fill="#60A5FA" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">MATCH: 98%</text>
    </g>

    <!-- Card Bottom Feature Note -->
    <g transform="translate(24, 355)">
      <rect width="332" height="50" rx="12" fill="#0284C7" fill-opacity="0.15" stroke="#0284C7" stroke-width="1" />
      <text x="16" y="24" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">✓ Real-time KUCCPS 2025/2026 Booklet Data</text>
      <text x="16" y="40" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Grade validation, Subject weighting &amp; Alternative degrees</text>
    </g>
  </g>
</svg>
