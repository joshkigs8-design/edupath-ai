<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Rich Ultramarine to Midnight Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Glass Rim Stroke Gradient -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.6" />
    </linearGradient>

    <!-- Emerald / Mint AI Spark Gradient -->
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Cap Top Diamond Ice Shimmer -->
    <linearGradient id="capTopGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="emeraldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Squircle Backdrop with Depth -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#rimGrad)" stroke-width="1.5" />

  <!-- 2. Ambient Inner Shading -->
  <circle cx="32" cy="18" r="18" fill="#60A5FA" fill-opacity="0.12" />

  <!-- 3. Graduation Mortarboard Diamond (Top Facet) -->
  <path d="M32 13 L51 23.5 L32 34 L13 23.5 Z" fill="url(#capTopGrad)" />

  <!-- 4. Dimensional Left Facet -->
  <path d="M13 23.5 L32 34 L32 46.5 L13 36 Z" fill="#60A5FA" fill-opacity="0.95" />

  <!-- 5. Dimensional Right Facet -->
  <path d="M32 34 L51 23.5 L51 36 L32 46.5 Z" fill="#1D4ED8" />

  <!-- 6. Apex AI Guidance Spark (Beacon Star) -->
  <path d="M43 15 L53 13 L51 23.5 Z" fill="url(#emeraldGrad)" filter="url(#emeraldGlow)" />
  <circle cx="51.5" cy="14" r="2.75" fill="#A7F3D0" />
  <circle cx="51.5" cy="14" r="1.2" fill="#FFFFFF" />

  <!-- 7. Forward Trajectory Pathway Foundation (Ascending Chevron) -->
  <path d="M22 43.5 L32 49 L42 43.5 L42 48.5 L32 54 L22 48.5 Z" fill="url(#emeraldGrad)" />
</svg>